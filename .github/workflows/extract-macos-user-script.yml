name: Extract macOS User script

on:
  push:
    paths:
      - "docs/Airgapped MacOS User.md"
      - ".github/workflows/extract-macos-user-script.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract zsh extract blocks into .sh
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import re

          md_path = Path("docs/Airgapped MacOS User.md")
          out_path = Path("docs/Airgapped MacOS User.sh")
          text = md_path.read_text(encoding="utf-8")

          pattern = re.compile(r"```zsh extract\n(.*?)```", re.DOTALL)
          blocks = pattern.findall(text)

          if not blocks:
              raise SystemExit("No ```zsh extract blocks found in the Markdown")

          header = """#!/bin/zsh
# Airgapped MacOS User setup script for EntropyLab
# GENERATED FILE — do not edit by hand.
# Source of truth: docs/Airgapped MacOS User.md
# Regenerated by GitHub Action: extract-macos-user-script.yml
#
# Run from an admin account that already has a Secure Token.
# Install Chromium or Google Chrome from a verified .dmg BEFORE going offline.
set -euo pipefail

"""

          body = "\n\n".join(b.strip() + "\n" for b in blocks)
          out_path.write_text(header + body, encoding="utf-8")
          print(f"Wrote {out_path} from {len(blocks)} extract block(s)")
          PY

      - name: Commit updated script if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/Airgapped MacOS User.sh"
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: regenerate Airgapped MacOS User.sh from Markdown"
            git push
          fi
